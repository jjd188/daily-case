name: Generate daily cases

# Keeps the next two weeks of cases published. Runs weekly; generate.js skips dates that
# already have a file, so a run only pays for what's missing. Pages serves the repo as-is,
# so committing the new daily/*.json files is the publish step.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to cover"
        default: "14"

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate cases
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Keep going on failure so cases that did generate still get published.
          node generate.js --days "${{ github.event.inputs.days || '14' }}" || echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Re-validate everything on disk
        run: node validate.js && node validate.js daily/*.json

      - name: Commit new cases
        run: |
          git config user.name "daily-case bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -m "Add generated cases"
            git push
          fi

      - name: Fail the run if any date could not be generated
        if: steps.gen.outputs.failed == 'true'
        run: |
          echo "Some dates failed to generate; the app uses a premade case for those days."
          exit 1
